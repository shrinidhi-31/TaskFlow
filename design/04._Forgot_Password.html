<body class="bg-light-background text-light-on-background font-body antialiased">
  <div class="min-h-screen flex flex-col items-center justify-center px-gutter-md py-gutter-xl bg-light-background">
    <div class="w-full max-w-md flex flex-col gap-gutter-lg">
      <div class="flex flex-col items-center text-center gap-gutter-sm">
        <div class="w-11 h-11 rounded-md bg-light-secondary-container text-light-on-secondary-container flex items-center justify-center">
          <span class="material-symbols-outlined text-[22px]" aria-hidden="true">lock_reset</span>
        </div>
        <h1 class="font-headline text-headline-lg text-light-on-surface" data-design-text-token="headline-lg">Reset your password</h1>
        <p class="font-body text-body-md text-light-on-surface-variant" data-design-text-token="body-md">Enter your email and we&#39;ll send you a reset link.</p>
      </div>

      <main class="bg-light-surface-container-lowest rounded-lg border border-light-outline-variant/60 p-gutter-lg sm:p-gutter-xl shadow-[0_4px_20px_rgba(26,28,26,0.05)]">
        <form id="reset-form" class="flex flex-col gap-gutter-md">
          <label class="flex flex-col gap-gutter-xs">
            <span class="font-body text-label-md text-light-on-surface" data-design-text-token="label-md">Email address</span>
            <input id="reset-email" type="email" required value="maya.lin@taskflow.app" placeholder="you@example.com" class="w-full rounded-md border border-light-outline-variant bg-light-surface-container-lowest px-3.5 py-2.5 font-body text-body-md text-light-on-surface focus:border-light-primary focus:ring-2 focus:ring-light-primary/20 focus:outline-none">
          </label>
          <button type="submit" data-component-id="button-primary" data-component-type="button" data-component-variant="primary" class="w-full py-2.5 rounded bg-light-primary text-light-on-primary shadow-sm hover:bg-light-primary-container active:scale-[0.98] transition-[transform,background-color] duration-state-change">
            <span class="font-body text-label-lg" data-design-text-token="label-lg">Send Reset Link</span>
          </button>
        </form>

        <!-- Success Confirmation State -->
        <div id="reset-success" class="hidden flex flex-col items-center text-center gap-gutter-md py-gutter-sm">
          <span class="w-12 h-12 rounded-full bg-success-bg text-success inline-flex items-center justify-center" aria-hidden="true">
            <span class="material-symbols-outlined text-[24px]">mark_email_read</span>
          </span>
          <div class="flex flex-col gap-gutter-xs">
            <h2 class="font-headline text-title-lg text-light-on-surface" data-design-text-token="title-lg">Reset link sent</h2>
            <p class="font-body text-body-md text-light-on-surface-variant text-pretty" data-design-text-token="body-md">We&#39;ve sent password reset instructions to <span class="font-medium text-light-on-surface" id="sent-email">maya.lin@taskflow.app</span>.</p>
          </div>
          <a href="../02-login/Login.html" class="w-full py-2.5 rounded bg-light-primary text-light-on-primary text-center font-body text-label-lg" data-design-text-token="label-lg">Back to Login</a>
        </div>
      </main>

      <p class="text-center font-body text-body-md text-light-on-surface-variant">
        <a href="../02-login/Login.html" class="inline-flex items-center gap-1 font-body text-label-lg text-light-primary hover:underline">
          <span class="material-symbols-outlined text-[16px]" aria-hidden="true">arrow_back</span>
          Back to Login
        </a>
      </p>
    </div>
  </div>
  <script>
    document.getElementById('reset-form').addEventListener('submit', (e) => {
      e.preventDefault();
      document.getElementById('sent-email').textContent = document.getElementById('reset-email').value.trim();
      document.getElementById('reset-form').classList.add('hidden');
      document.getElementById('reset-success').classList.remove('hidden');
    });
  </script>
