<body class="bg-light-background text-light-on-background font-body antialiased">
  <div class="min-h-screen flex flex-col items-center justify-center px-gutter-md py-gutter-xl bg-light-background">
    <div class="w-full max-w-md flex flex-col gap-gutter-lg">
      <!-- Brand Header -->
      <div class="flex flex-col items-center text-center gap-gutter-sm">
        <div class="w-11 h-11 rounded-md bg-light-primary text-light-on-primary flex items-center justify-center shadow-sm">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="3" y="4" width="18" height="16" rx="4" stroke="currentColor" stroke-width="2"></rect>
            <path d="M8 12.5L10.8 15.2L16.5 9.2" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </div>
        <h1 class="font-headline text-headline-lg text-light-on-surface" data-design-text-token="headline-lg">Welcome back</h1>
        <p class="font-body text-body-md text-light-on-surface-variant" data-design-text-token="body-md">Sign in to TaskFlow to organise your day.</p>
      </div>

      <!-- Login Card -->
      <main class="bg-light-surface-container-lowest rounded-lg border border-light-outline-variant/60 p-gutter-lg sm:p-gutter-xl shadow-[0_4px_20px_rgba(26,28,26,0.05)]">
        <form id="login-form" class="flex flex-col gap-gutter-md" novalidate>
          <div id="login-error" class="hidden rounded-md bg-light-error-container text-light-on-error-container px-3.5 py-2.5 font-body text-body-sm" role="alert">
            Please enter a valid email address and password.
          </div>

          <label class="flex flex-col gap-gutter-xs">
            <span class="font-body text-label-md text-light-on-surface" data-design-text-token="label-md">Email address</span>
            <input id="login-email" type="email" required value="maya.lin@taskflow.app" placeholder="you@example.com" class="w-full rounded-md border border-light-outline-variant bg-light-surface-container-lowest px-3.5 py-2.5 font-body text-body-md text-light-on-surface placeholder:text-light-on-surface-variant/70 focus:border-light-primary focus:ring-2 focus:ring-light-primary/20 focus:outline-none">
          </label>

          <label class="flex flex-col gap-gutter-xs">
            <span class="font-body text-label-md text-light-on-surface" data-design-text-token="label-md">Password</span>
            <div class="relative flex items-center">
              <input id="login-password" type="password" required value="••••••••••••" placeholder="Enter your password" class="w-full rounded-md border border-light-outline-variant bg-light-surface-container-lowest pl-3.5 pr-10 py-2.5 font-body text-body-md text-light-on-surface placeholder:text-light-on-surface-variant/70 focus:border-light-primary focus:ring-2 focus:ring-light-primary/20 focus:outline-none">
              <button id="toggle-pwd" type="button" aria-label="Toggle password visibility" class="absolute right-2.5 w-8 h-8 rounded inline-flex items-center justify-center text-light-on-surface-variant hover:text-light-on-surface">
                <span id="toggle-pwd-icon" class="material-symbols-outlined text-[18px]" aria-hidden="true">visibility</span>
              </button>
            </div>
          </label>

          <div class="flex items-center justify-between gap-gutter-sm">
            <label class="inline-flex items-center gap-2 cursor-pointer">
              <input type="checkbox" checked class="rounded-sm border-light-outline-variant text-light-primary focus:ring-light-primary">
              <span class="font-body text-body-sm text-light-on-surface-variant" data-design-text-token="body-sm">Remember me</span>
            </label>
            <a href="../04-forgot-password/ForgotPassword.html" class="font-body text-label-md text-light-primary hover:underline" data-design-text-token="label-md">Forgot password?</a>
          </div>

          <button type="submit" data-component-id="button-primary" data-component-type="button" data-component-variant="primary" class="w-full py-2.5 rounded bg-light-primary text-light-on-primary shadow-sm hover:bg-light-primary-container active:scale-[0.98] transition-[transform,background-color] duration-state-change">
            <span class="font-body text-label-lg" data-design-text-token="label-lg">Login</span>
          </button>
        </form>
      </main>

      <p class="text-center font-body text-body-md text-light-on-surface-variant" data-design-text-token="body-md">
        Don&#39;t have an account?
        <a href="../03-signup/SignUp.html" class="font-body text-label-lg text-light-primary hover:underline">Create an account</a>
      </p>
    </div>
  </div>

  <script>
    (function () {
      const pwd = document.getElementById('login-password');
      const icon = document.getElementById('toggle-pwd-icon');
      document.getElementById('toggle-pwd').addEventListener('click', () => {
        const isPwd = pwd.type === 'password';
        pwd.type = isPwd ? 'text' : 'password';
        icon.textContent = isPwd ? 'visibility_off' : 'visibility';
      });
      document.getElementById('login-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('login-email').value.trim();
        const err = document.getElementById('login-error');
        if (!email || !email.includes('@') || !pwd.value.trim()) {
          err.classList.remove('hidden');
          return;
        }
        err.classList.add('hidden');
        window.location.href = '../05-dashboard/Dashboard.html';
      });
    })();
  </script>


</body></html>
